name: CD - Build, Push & Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: cs-usuarios-api
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: default
  DEPLOYMENT_NAME: cs-usuarios-api
  MANIFEST_FILE: k8s/aws/services/cs-usuarios.yaml
  DOCKERFILE_PATH: src/Usuarios.Api/Dockerfile

# ── PERMISSOES NECESSARIAS PARA SEGURANCA ──────────────────────────
permissions:
  contents: read           # Permite que o checkout leia o seu código
  security-events: write   # Obrigatório para fazer o upload do relatório SARIF do Trivy
# ───────────────────────────────────────────────────────────────────

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  build-push-deploy:
    needs: ci-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Usuarios (código da aplicação)
        uses: actions/checkout@v4
        with:
          path: usuarios

      - name: Checkout Infra (manifests K8s)
        uses: actions/checkout@v4
        with:
          repository: gmerendi/ES.ConexaoSolidaria.Infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: develop
          path: infra

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem Docker
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}
        run: |
          cd usuarios
          # Gera o build com a tag única E com a tag latest
          docker build -f $DOCKERFILE_PATH \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          # Envia ambas as tags para o ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Configurar kubeconfig do EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Aplicar user secrets
        run: |
          kubectl create secret generic cs-user-secrets \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --from-literal=USUARIOS_POSTGRES_USER="${{ secrets.USUARIOS_POSTGRES_USER }}" \
            --from-literal=USUARIOS_POSTGRES_PASSWORD="${{ secrets.USUARIOS_POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRETKEY="${{ secrets.JWT_SECRETKEY }}" \
            --from-literal=JWT_ISSUER="${{ secrets.JWT_ISSUER }}" \
            --from-literal=JWT_AUDIENCE="${{ secrets.JWT_AUDIENCE }}" \
            --from-literal=JWT_EXPIRATION_HOURS="${{ secrets.JWT_EXPIRATION_HOURS }}" \
            --from-literal=AES_KEY="${{ secrets.AES_KEY }}" \
            --from-literal=RABBITMQ_USERNAME="${{ secrets.RABBITMQ_USERNAME }}" \
            --from-literal=RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar aws credentials
        run: |
          kubectl create secret generic cs-aws-credentials \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
            -n ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifest Kubernetes
        run: |
          kubectl apply -f infra/${{ env.MANIFEST_FILE }} -n ${{ env.K8S_NAMESPACE }}

      - name: Atualizar imagem do Deployment
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.DEPLOYMENT_NAME }}=$IMAGE \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} --timeout=120s
