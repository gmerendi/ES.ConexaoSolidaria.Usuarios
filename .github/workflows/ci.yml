name: CI - Build & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_PATH: 'ES.ConexaoSolidaria.Usuarios.slnx'
  IMAGE_NAME: 'conexao-solidaria-usuarios:test'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependências
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

 # ── TESTES UNITARIOS ──────────────────────────
 
      - name: Testes unitários
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration Release --verbosity normal --logger &quot;trx;LogFileName=test-results.trx&quot; --collect:&quot;XPlat Code Coverage&quot;

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Publicar cobertura de código
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

      # ── SCAN DE SEGURANÇA DA IMAGEM DOCKER ──────────────────────────

      - name: Build da imagem Docker local
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .

      - name: Escaneamento de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'trivy-report.html'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # Mude para '1' se quiser quebrar o build caso encontre vulnerabilidades graves

      - name: Publicar relatório de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: 'trivy-report.html'
